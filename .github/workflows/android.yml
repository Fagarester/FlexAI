name: Build Android APK (Manual Release)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    # 1. Завантажуємо твій код
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Встановлюємо Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Завантажуємо wrapper скрипт Kotlin Toolchain (замість Amper)
    - name: Download Kotlin Toolchain Wrapper
      run: |
        curl -fsSL https://raw.githubusercontent.com/JetBrains/kotlin-toolchain/main/kotlin -o kotlin
        chmod +x kotlin

    # 4. Запускаємо збірку APK через Kotlin Toolchain
    - name: Build Android Release
      run: ./kotlin build :app

    # 5. Прикріплюємо готовий APK-файл до релізу v1.0.0
    - name: Attach APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
