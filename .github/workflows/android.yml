name: Build Android APK (Manual Release)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Download Kotlin Toolchain Wrapper
      run: |
        curl -fsSL https://raw.githubusercontent.com/JetBrains/kotlin-toolchain/main/kotlin -o kotlin
        chmod +x kotlin

    # ✅ ПРАВИЛЬНО - без :app
    - name: Build Android Release
      run: ./kotlin build

    - name: Attach APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
