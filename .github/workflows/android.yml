name: Build Android APK (Manual Release)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем твой код
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Устанавливаем Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Настраиваем Amper официальным и надежным способом
    - name: Setup Amper Build System
      uses: jetbrains/setup-amper@v1
      with:
        amper-version: '0.5.0'

    # 4. Запускаем сборку APK через установленный Amper
    - name: Build Android Release
      run: amper build :app

    # 5. Прикрепляем готовый APK-файл к релизу v1.0.0
    - name: Attach APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
