name: Build Android APK (Amper)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем твой код
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Устанавливаем Java (необходима для работы Kotlin)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Скачиваем инструмент Amper на виртуальную машину GitHub
    - name: Download Amper
      run: |
        curl -L https://jetbrains.team -o amper.jar
        echo '#!/bin/bash' > amper
        echo 'java -jar "'$(pwd)'/amper.jar" "$@"' >> amper
        chmod +x amper

    # 4. Запускаем сборку APK через Amper
    - name: Build Android Release
      run: ./amper build :app

    # 5. Публикуем готовый APK в релизы GitHub
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk # Amper обычно складывает файлы в эту папку
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
