name: Build Android APK (Amper)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Download Amper
      run: |
        curl -L https://jetbrains.team -o amper.jar
        echo '#!/bin/bash' > amper
        echo 'java -jar "'$(pwd)'/amper.jar" "$@"' >> amper
        chmod +x amper

    - name: Build Android Release
      run: ./amper build :app

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
