name: Android CI (debug build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # В репозитории пока нет gradle-wrapper.jar (см. README), поэтому
      # собираем через Gradle, установленный действием setup-gradle выше.
      # После того как локально (например, при открытии проекта в Android
      # Studio) будет сгенерирован gradlew/gradle-wrapper.jar, эту команду
      # можно заменить на `./gradlew assembleDebug --no-daemon`.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flexai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
